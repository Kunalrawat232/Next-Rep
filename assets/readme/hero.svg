<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Next Rep: say the set, it is logged</title>
  <desc id="d">The phrase "bench press 60 kilo 8 reps" becomes a confirm card: 20 Kg each side times 2 is 40 Kg, plus a 20 Kg bar, total 60 Kg, with Log set and Cancel buttons.</desc>
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect width="1200" height="440" rx="28" fill="#000000"/>
  <rect width="1200" height="440" rx="28" fill="url(#glow)"/>

  <text class="mono" x="64" y="104" font-size="18" letter-spacing="3" fill="#5b8cff">VOICE-FIRST GYM LOGGER · PWA</text>
  <text x="62" y="196" font-size="88" font-weight="800" fill="#f5f5f7" letter-spacing="-2">Next Rep</text>
  <text x="64" y="262" font-size="40" font-weight="700" fill="#f5f5f7">Say the <tspan fill="#5b8cff">set.</tspan></text>
  <text x="64" y="312" font-size="22" fill="#a1a1a6">Bar weight and per-side maths done for you.</text>
  <text x="64" y="344" font-size="22" fill="#a1a1a6">Logged even with no signal.</text>

  <g transform="translate(64 392)" fill="#38383a">
    <rect x="0" y="-3" width="520" height="6" rx="3"/>
    <rect x="60" y="-22" width="14" height="44" rx="4" fill="#5b8cff"/>
    <rect x="80" y="-16" width="12" height="32" rx="4" fill="#5b8cff" opacity="0.7"/>
    <rect x="446" y="-16" width="12" height="32" rx="4" fill="#5b8cff" opacity="0.7"/>
    <rect x="466" y="-22" width="14" height="44" rx="4" fill="#5b8cff"/>
  </g>

  <rect x="690" y="36" width="460" height="368" rx="28" fill="#1c1c1e" stroke="#38383a" stroke-width="2"/>
  <text x="714" y="82" font-size="18" fill="#a1a1a6">Heard: “bench press 60 kilo 8 reps”</text>
  <text x="714" y="122" font-size="26" font-weight="700" fill="#f5f5f7">Barbell Bench Press · 8 reps</text>
  <rect x="714" y="146" width="412" height="146" rx="16" fill="#2c2c2e" stroke="#38383a"/>
  <text x="738" y="188" font-size="22" fill="#f5f5f7">20 Kg each side × 2</text>
  <text x="1102" y="188" font-size="22" fill="#f5f5f7" text-anchor="end">40 Kg</text>
  <text x="738" y="224" font-size="22" fill="#f5f5f7">+ bar</text>
  <text x="1102" y="224" font-size="22" fill="#f5f5f7" text-anchor="end">20 Kg</text>
  <rect x="738" y="240" width="364" height="2" fill="#38383a"/>
  <text x="738" y="274" font-size="24" font-weight="700" fill="#f5f5f7">Total</text>
  <text x="1102" y="274" font-size="24" font-weight="700" fill="#34c759" text-anchor="end">60 Kg</text>
  <rect x="714" y="320" width="190" height="56" rx="14" fill="#5b8cff"/>
  <text x="809" y="356" font-size="22" font-weight="700" fill="#000000" text-anchor="middle">Log set</text>
  <rect x="920" y="320" width="206" height="56" rx="14" fill="#2c2c2e" stroke="#38383a"/>
  <text x="1023" y="356" font-size="22" font-weight="600" fill="#f5f5f7" text-anchor="middle">Cancel</text>
</svg>
