<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">AI listens, code verifies</title>
  <desc id="d">Five steps from voice to storage: speak or tap, parse with rules first and Gemini if unsure, code verifies every number, you confirm the bar and per-side breakdown, then the set is saved on the phone and synced later.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect width="1200" height="280" rx="28" fill="#000000"/>
  <text x="48" y="58" font-size="30" font-weight="800" fill="#f5f5f7">AI listens, <tspan fill="#5b8cff">code verifies.</tspan></text>
  <text class="mono" x="1152" y="56" font-size="18" fill="#a1a1a6" text-anchor="end" letter-spacing="2">HOW A SET IS LOGGED</text>

  <g fill="#38383a">
    <rect x="236" y="168" width="28" height="3"/><rect x="460" y="168" width="28" height="3"/>
    <rect x="684" y="168" width="28" height="3"/><rect x="908" y="168" width="28" height="3"/>
  </g>

  <g>
    <rect x="48" y="100" width="188" height="140" rx="18" fill="#1c1c1e" stroke="#38383a" stroke-width="2"/>
    <text class="mono" x="68" y="134" font-size="18" fill="#5b8cff">01</text>
    <text x="68" y="166" font-size="26" font-weight="700" fill="#f5f5f7">Say it</text>
    <text x="68" y="198" font-size="18" fill="#a1a1a6">speak or tap,</text>
    <text x="68" y="222" font-size="18" fill="#a1a1a6">even offline</text>
  </g>
  <g>
    <rect x="272" y="100" width="188" height="140" rx="18" fill="#1c1c1e" stroke="#38383a" stroke-width="2"/>
    <text class="mono" x="292" y="134" font-size="18" fill="#5b8cff">02</text>
    <text x="292" y="166" font-size="26" font-weight="700" fill="#f5f5f7">Parse</text>
    <text x="292" y="198" font-size="18" fill="#a1a1a6">rules first,</text>
    <text x="292" y="222" font-size="18" fill="#a1a1a6">Gemini if unsure</text>
  </g>
  <g>
    <rect x="496" y="100" width="188" height="140" rx="18" fill="#1c1c1e" stroke="#5b8cff" stroke-width="3"/>
    <text class="mono" x="516" y="134" font-size="18" fill="#5b8cff">03</text>
    <text x="516" y="166" font-size="26" font-weight="700" fill="#f5f5f7">Verify</text>
    <text x="516" y="198" font-size="18" fill="#a1a1a6">code checks</text>
    <text x="516" y="222" font-size="18" fill="#a1a1a6">every number</text>
  </g>
  <g>
    <rect x="720" y="100" width="188" height="140" rx="18" fill="#1c1c1e" stroke="#38383a" stroke-width="2"/>
    <text class="mono" x="740" y="134" font-size="18" fill="#5b8cff">04</text>
    <text x="740" y="166" font-size="26" font-weight="700" fill="#f5f5f7">Confirm</text>
    <text x="740" y="198" font-size="18" fill="#a1a1a6">you see the</text>
    <text x="740" y="222" font-size="18" fill="#a1a1a6">bar + side maths</text>
  </g>
  <g>
    <rect x="944" y="100" width="208" height="140" rx="18" fill="#1c1c1e" stroke="#38383a" stroke-width="2"/>
    <text class="mono" x="964" y="134" font-size="18" fill="#34c759">05</text>
    <text x="964" y="166" font-size="26" font-weight="700" fill="#f5f5f7">Save</text>
    <text x="964" y="198" font-size="18" fill="#a1a1a6">on the phone,</text>
    <text x="964" y="222" font-size="18" fill="#a1a1a6">synced later</text>
  </g>
</svg>
